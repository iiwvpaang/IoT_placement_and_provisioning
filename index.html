<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browser-based IoT Placement and Provisioning Tool">
  <title>IoT Device Manager — Placement & Provisioning</title>
  
  <!-- External Stylesheet -->
  <link rel="stylesheet" href="./styles/main.css">
  
  <!-- ESM Entry Point (Non-blocking & Deferred Execution) -->
  <script type="module" src="./js/main.js"></script>
</head>
<body data-app-state="ready">

  <!-- Accessible Skip Link for Keyboard Users -->
  <a href="#main-canvas" class="skip-to-content">Skip to main content</a>

  <header class="app-header">
    <div class="brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-title">IoT Provisioner</span>
    </div>

    <nav class="app-nav">
      <button type="button" 
              class="nav-btn" 
              data-target="panel-toolbar" 
              aria-expanded="false" 
              aria-controls="panel-toolbar">
        <span>Toolbar</span>
      </button>

      <button type="button" 
              class="nav-btn" 
              data-target="panel-settings" 
              aria-expanded="false" 
              aria-controls="panel-settings">
        <span>Settings</span>
      </button>
    </nav>
  </header>

  <aside id="panel-toolbar" class="drawer-panel" hidden data-state="closed">
    <h3>Placement Tools</h3>
    <div class="tool-grid">
      <button type="button" class="tool-item" data-action="spawn-device" data-type="sensor">
        + Add Sensor
      </button>
      <button type="button" class="tool-item" data-action="spawn-device" data-type="gateway">
        + Add Gateway
      </button>
    </div>
  </aside>

  <aside id="panel-settings" class="drawer-panel" hidden data-state="closed">
    <h3>Tool Settings</h3>
    <label class="setting-row">
      <span>Show Grid Mesh</span>
      <input type="checkbox" id="toggle-grid" checked />
    </label>
  </aside>

  <div class="workspace">
    <main id="main-canvas" class="canvas-grid" tabindex="0" data-grid-active="true">
        <article class="device-node" 
                id="dev-101" 
                tabindex="0"
                data-type="sensor"
                data-status="idle" 
                data-selected="false"
                style="--x: 120px; --y: 100px;">
        <header class="node-header">
            <span class="node-title">Sensor-01</span>
        </header>
        <div class="node-body">
            <span class="status-indicator"></span>
            <button type="button" class="btn-action" data-action="provision">Provision</button>
        </div>
        </article>
    </main>
  </div>

  <footer role="contentinfo">
    <small>Status: System Operational</small>
  </footer>

</body>
</html>
